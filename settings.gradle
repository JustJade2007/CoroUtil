pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'net.fabricmc.fabric-loom') {
                useModule("net.fabricmc:fabric-loom:${requested.version}")
            }
        }
    }
    repositories {
		maven {
			url "https://maven.firstdark.dev/releases"
		}
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
		maven { url = 'https://maven.neoforged.net/releases' }
		maven {
			name = 'Parchment'
			url = 'https://maven.parchmentmc.org/'
		}
		maven {
			name = 'Spongepowered (Mixin)'
			url = 'https://repo.spongepowered.org/repository/maven-public/'
		}
        mavenCentral()
        gradlePluginPortal()
    }
}

buildscript {
    repositories {
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force 'org.ow2.asm:asm:9.10.1'
            force 'org.ow2.asm:asm-commons:9.10.1'
            force 'org.ow2.asm:asm-tree:9.10.1'
            force 'org.ow2.asm:asm-analysis:9.10.1'
            force 'org.ow2.asm:asm-util:9.10.1'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}